<div class="c"><h3>Paie du mois</h3><input id="bm" type="month" value="${bm}" onchange="bm=this.value"><div class="t"><table><tr><th>Nom</th><th>Brut</th><th>CNSS</th><th>IUTS</th><th>Net</th></tr>${S.emp.map((e,i)=>`<tr><td>${E(e.n)} <a onclick="editE(${i})" style="color:var(--ac)">Fiche</a> <a onclick="bull(${i})" style="color:var(--ac)">Bulletin</a> <a onclick="S.emp.splice(${i},1);sv();go()" style="color:var(--rd)">✕</a></td><td>${F(T[i].brut)}</td><td>${F(T[i].cs)}</td><td>${F(T[i].iu)}</td><td>${F(T[i].net)}</td></tr>`).join('')}</table></div>
<p class="m">Charges patronales : CNSS ${F(T.reduce((a,t)=>a+t.cp,0))} · TPA ${F(T.reduce((a,t)=>a+t.tpa,0))}</p><button class="b" onclick="comp()">Comptabiliser la paie</button><button class="b s" onclick="bull(-1)">Imprimer tous les bulletins</button><button class="b s" onclick="vir()">Exporter les virements (CSV)</button></div>`}
function addE(){const n=$('#en').value.trim(),b=+$('#eb').value;if(!n||!b)return;S.emp.push({id:Date.now(),n,brut:b,ch:+$('#ec').value,poste:$('#ep').value.trim(),cnss:$('#ei').value.trim()});sv();go()}
function comp(){if(!S.emp.length)return;if(S.pays[bm]){alert('La paie de '+bm+' est déjà comptabilisée. Choisissez un autre mois, ou faites corriger par le comptable.');return}const T=S.emp.map(e=>calcE(e)),s=k=>T.reduce((a,t)=>a+t[k],0);
post('Paie '+bm,[[661,s('brut')+s('ind'),0],[664,s('cp'),0],[641,s('tpa'),0],[422,0,s('net')],[421,0,s('av')],[431,0,s('cs')+s('cp')],[447,0,s('iu')+s('tpa')]].filter(l=>l[1]||l[2]));S.pays[bm]=S.emp.map((e,k)=>({id:e.id,n:e.n,brut:T[k].brut,net:T[k].net,cs:T[k].cs,iu:T[k].iu}));audit('Paie '+bm+' comptabilisée');sv();tab='journal';go()}
// REGLAGES
function reg(){const c=S.cfg,f=(k,l)=>`<label class="m">${l}</label><input data-k="${k}" type="${TXT.includes(k)?'text':'number'}" step="any" value="${E(c[k])}">`;
return `<div class="c"><h3>Paramètres</h3>${f('nom','Entreprise')}${f('adr','Adresse')}${f('ifu','IFU')}${f('rccm','RCCM')}${f('cnssE','N° employeur CNSS')}${f('hs','Majoration heures supplémentaires %')}${f('blk','Bloquer la vente si stock épuisé (0 = non, 1 = oui)')}${f('tva','TVA %')}${f('cs','CNSS salariale %')}${f('cp','CNSS patronale % (total)')}${f('plaf','Plafond CNSS mensuel')}${f('tpa','TPA %')}${f('abat','Abattement IUTS %')}
<label class="m">Barème IUTS : plafond de tranche ; taux % (une tranche par ligne)</label><textarea id="tr" style="width:100%;height:120px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px">${S.tr.map(t=>(t[0]>=1e12?'999999999':t[0])+';'+t[1]).join('\n')}</textarea>
<label class="m">Réduction charges de famille % (0 à 4 charges)</label><input id="fam" value="${c.fam.join(',')}"><button class="b" onclick="saveR()">Enregistrer</button></div>
<div class="c"><h3>Produits</h3><div class="r"><input id="pn" placeholder="Nom"><input id="pp" type="number" inputmode="numeric" placeholder="Prix TTC"></div><input id="pc" placeholder="Catégorie (ex : Boissons)"><div class="r" style="align-items:center"><label class="b s" style="text-align:center;margin:6px 0 0">📷 Photo<input type="file" accept="image/*" hidden onchange="photo(this,-1)"></label><img id="pv" class="th" style="display:none;flex:none;width:48px"></div><button class="b s" onclick="addP()">Ajouter produit</button></div>
<div class="c"><h3>Mes produits (photo et prix)</h3>${S.prods.map((p,i)=>`<div class="ln"><label class="th">${p.img?`<img src="${E(p.img)}">`:'📷'}<input type="file" accept="image/*" hidden onchange="photo(this,${i})"></label><b>${E(p.n)}<br><span class="m">${E(p.c||'Autres')}${p.pa?' · achat '+F(p.pa):''}</span></b><input type="number" inputmode="numeric" style="width:92px" value="${p.p}" onchange="S.prods[${i}].p=+this.value;sv()"></div>`).join('')}<p class="m">Touchez la vignette pour prendre ou choisir une photo.</p></div>
${U.role=='owner'?usersCard():''}${auditCard()}${appCard()}${bakCard()}<div class="c"><h3>Données</h3><p class="m">Stockées sur cet appareil, fonctionne hors-ligne.</p><button class="b s" onclick="if(U.role!='owner')alert('Réservé au propriétaire.');else if(confirm('Tout effacer ?')){P.nuke().then(()=>location.reload())}">Réinitialiser</button></div>`}
function saveR(){document.querySelectorAll('[data-k]').forEach(i=>S.cfg[i.dataset.k]=TXT.includes(i.dataset.k)?i.value:+i.value);
S.tr=$('#tr').value.split('\n').filter(x=>x.trim()).map(x=>x.split(';').map(Number)).map(t=>[t[0]>=999999999?1e12:t[0],t[1]]);S.cfg.fam=$('#fam').value.split(',').map(Number);sv();go()}
function addP(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!p)return;S.prods.push({n,p,c:$('#pc').value.trim()||'Autres',s:0,img:nImg});nImg='';sv();go()}
// STOCK
function stockOld(){return `<div class="c"><h3>Stock</h3><div class="t"><table><tr><th>Produit</th><th>Quantité</th></tr>${S.prods.map((p,i)=>`<tr><td>${E(p.n)} ${(p.s||0)<10?'<span style="color:var(--rd)">⚠ bas</span>':''}</td><td><input type="number" inputmode="numeric" style="width:90px" value="${p.s||0}" onchange="S.prods[${i}].s=+this.value;sv();go()"></td></tr>`).join('')}</table></div><p class="m">Chaque vente décrémente le stock automatiquement.</p></div>`}
// ETATS
const B=()=>{const b={};S.ent.forEach(e=>e.l.forEach(l=>{b[l[0]]=b[l[0]]||[0,0];b[l[0]][0]+=l[1];b[l[0]][1]+=l[2]}));return b};
function etats(){const b=B(),pc=[],cc=[],A=[],P=[];let pr=0,ch=0;
Object.keys(b).sort().forEach(a=>{const s=b[a][0]-b[a][1];if(a[0]=='7'){pr-=s;pc.push([a,-s])}else if(a[0]=='6'){ch+=s;cc.push([a,s])}else if(s>=0)A.push([a,s]);else P.push([a,-s])});
const r=pr-ch,ta=A.reduce((x,y)=>x+y[1],0),tp=P.reduce((x,y)=>x+y[1],0)+r,rw=l=>`<tr><td>${l[0]} ${AC[l[0]]||''}</td><td>${F(l[1])}</td></tr>`;
return `<div class="c"><h3>Compte de résultat</h3><div class="t"><table><tr><th>Produits</th><th></th></tr>${pc.map(rw).join('')}<tr><th>Charges</th><th></th></tr>${cc.map(rw).join('')}<tr><th>Résultat net</th><th style="color:${r<0?'var(--rd)':'var(--ac)'}">${F(r)}</th></tr></table></div></div>
<div class="c"><h3>Bilan</h3><div class="t"><table><tr><th>Actif</th><th></th></tr>${A.map(rw).join('')}<tr><th>Total actif</th><th>${F(ta)}</th></tr><tr><th>Passif</th><th></th></tr>${P.map(rw).join('')}<tr><td>Résultat de l'exercice</td><td>${F(r)}</td></tr><tr><th>Total passif</th><th>${F(tp)}</th></tr></table></div><p class="m">${ta==tp?'✓ Bilan équilibré':'⚠ Écart à vérifier'} · États simplifiés, pas la liasse SYSCOHADA officielle.</p></div>`}
// IA LOCALE
function ia(){const D=S.sales.map(s=>s.d).sort(),j=D.length?Math.max(1,Math.round((Date.now()-new Date(D[0]))/864e5)+1):1,q={};S.sales.forEach(s=>s.lines.forEach(l=>q[l[0]]=(q[l[0]]||0)+l[1]));
const R=S.prods.map(p=>{const v=(q[p.n]||0)/j;return[p.n,v,v?(p.s||0)/v:null]}).filter(x=>x[2]!==null).sort((a,b)=>a[2]-b[2]);
const ca=S.sales.reduce((a,s)=>a+s.ttc,0)/j,b=B(),tr=Object.keys(b).filter(a=>a[0]=='5').reduce((s,a)=>s+b[a][0]-b[a][1],0),pa=S.emp.reduce((a,e)=>{const c=calcE(e);return a+c.brut+c.cp+c.tpa},0);
return `<div class="c"><h3>Prévision de ruptures</h3>${R.slice(0,6).map(x=>`<div class="l"><span>${E(x[0])}</span><span style="color:${x[2]<=7?'var(--rd)':'inherit'}">${x[2]<1?'rupture imminente':'~'+Math.floor(x[2])+' j'}</span></div>`).join('')||'<span class="m">Pas assez de ventes pour prévoir.</span>'}<p class="m">Calcul : stock ÷ ventes moyennes par jour.</p></div>
<div class="c"><h3>Trésorerie (indicatif)</h3><div class="l"><span>Trésorerie actuelle</span><span>${F(tr)}</span></div><div class="l"><span>Ventes moy./jour</span><span>${F(ca)}</span></div><div class="l"><span>Coût paie mensuel</span><span>${F(pa)}</span></div><div class="l"><b>Projection à 30 j</b><b>${F(tr+ca*30-pa)}</b></div><p class="m">Hors achats et autres charges.</p></div>
<div class="c"><h3>Assistant marketing SMS/WhatsApp</h3><select id="mp">${S.prods.map((p,i)=>`<option value="${i}">${E(p.n)}</option>`).join('')}</select><input id="mo" value="Promo du week-end"><button class="b" onclick="mk()">Générer</button><button class="b s" onclick="mkAI()">Rédiger avec Claude</button><div id="mkout"></div></div>
<div class="c"><h3>Assistant Claude</h3><div class="tbs"><button onclick="ask('Analyse mes ventes et propose 3 actions concrètes.')">Analyser mes ventes</button><button onclick="ask('Quels produits mettre en promotion ?')">Promotions</button><button onclick="ask('Prévois mes besoins de réapprovisionnement.')">Réapprovisionnement</button><button onclick="ask('Explique mon résultat et ma trésorerie simplement.')">Mes chiffres</button></div><input id="oq" placeholder="Posez votre question…"><button class="b" onclick="ask()">Demander à Claude</button><p id="oa" class="m" style="white-space:pre-wrap"></p></div>`}
function mk(){const p=S.prods[+$('#mp').value];if(!p)return;const n=S.cfg.nom,o=$('#mo').value,T=[`${o} ! ${p.n} à ${p.p} F chez ${n}. Venez vite, stock limité !`,`${n} : ${o}. ${p.n} seulement ${p.p} F TTC. Présentez ce message à la caisse.`,`Bonjour ! Cette semaine chez ${n} : ${p.n} à ${p.p} F. Partagez à vos amis de Ouaga et Bobo !`];
$('#mkout').innerHTML=T.map(t=>`<div class="l"><span>${E(t)}</span><a data-t="${E(t)}" onclick="window.open('https://wa.me/?text='+encodeURIComponent(this.dataset.t))" style="color:var(--ac)">WhatsApp</a></div>`).join('')}
